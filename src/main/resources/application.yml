spring:
  application:
    name: fraud-decisioning-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      ack-mode: manual
      observation-enabled: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

    template:
      observation-enabled: true

  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

  modulith:
    detection-strategy: explicitly-annotated

server:
  # Finish in-flight requests on SIGTERM (compose gives the container 30s).
  shutdown: graceful

fraud:
  security:
    # Optional HS256 shared secret (>= 32 bytes) for dev/test. When empty, the issuer-based decoder is
    # used and spring.security.oauth2.resourceserver.jwt.issuer-uri (or jwk-set-uri) must be set;
    # with neither, startup fails because no JwtDecoder exists. The public dev secret is rejected
    # outside the dev profile.
    jwt-secret: ${FRAUD_JWT_SECRET:}
    # Claim holding the roles; a dotted path is allowed (Keycloak: realm_access.roles).
    roles-claim: ${FRAUD_SECURITY_ROLES_CLAIM:roles}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
