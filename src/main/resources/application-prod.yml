# Production profile. Everything sensitive comes from the environment; there are no defaults.
# DB_URL / DB_USERNAME / DB_PASSWORD / KAFKA_BOOTSTRAP_SERVERS come from application.yml.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Required: startup fails if JWT_ISSUER_URI is unset. Tokens must carry the roles claim
          # named by FRAUD_SECURITY_ROLES_CLAIM (default `roles`; dotted path allowed, e.g.
          # realm_access.roles) with FRAUD_ANALYST / FRAUD_ADMIN. Do not set FRAUD_JWT_SECRET.
          # Optional audience check: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES=fraud-api
          issuer-uri: ${JWT_ISSUER_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
