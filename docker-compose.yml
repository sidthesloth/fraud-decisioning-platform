services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
      POSTGRES_DB: fraud
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fraud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-dev}
      # No OTLP collector in this compose file: don't sample/export spans by default.
      # To trace, run a collector and set TRACING_SAMPLING_PROBABILITY=1.0 and OTEL_EXPORTER_OTLP_TRACES_ENDPOINT.
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.0}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  pgdata:
